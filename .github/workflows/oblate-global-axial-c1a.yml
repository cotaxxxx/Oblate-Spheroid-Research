name: Oblate global axial C1a crossing bridge

"on":
  push:
    branches:
      - implementation/gt-boundary-two-chart
  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-axial-c1a-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Record checked-out head
        run: git rev-parse HEAD
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned prototype dependency
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements-prototype.txt
      - name: Install hash-pinned Arb binary wheel
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements-interval.txt
      - name: Run inherited C0a four-group raw audit
        run: PYTHONPATH=. python analysis/c0a_four_group_raw_audit.py
      - name: Run C1a producer
        run: PYTHONPATH=. python producer/global_axial_c1a_producer.py
      - name: Run C1a checker
        run: PYTHONPATH=. python checker/global_axial_c1a_checker.py
