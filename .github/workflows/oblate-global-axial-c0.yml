name: Oblate global axial C0 quantitative pitchfork

on:
  push:
    branches:
      - implementation/gt-boundary-two-chart
  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-axial-c0-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned prototype dependency
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements-prototype.txt
      - name: Install hash-pinned Arb binary wheel
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements-interval.txt
      - name: Run C0 producer
        run: PYTHONPATH=. python producer/global_axial_c0_producer.py
      - name: Run C0 checker
        run: PYTHONPATH=. python checker/global_axial_c0_checker.py
