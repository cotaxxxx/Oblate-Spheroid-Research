name: C0a worst-box term-by-chart diagnostic

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  c0a-term-chart-report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned prototype dependency
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements-prototype.txt
      - name: Install hash-pinned Arb binary wheel
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements-interval.txt
      - name: Run report-only C0a worst-box term/chart diagnostic
        run: PYTHONPATH=. python analysis/c0a_worst_box_term_chart_diagnostic.py
