name: Oblate global axial C1c lower-half exclusion

"on":
  push:
    branches:
      - implementation/gt-boundary-two-chart
  workflow_dispatch:

permissions:
  contents: read

jobs:
  global-axial-c1c-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Record checked-out head and amendment pin
        run: |
          git rev-parse HEAD
          git status --short
          git hash-object analysis/GLOBAL_AXIAL_C1C_PRE_RUN_AMENDMENT.md
          git hash-object producer/global_axial_c1c_producer.py
          git hash-object checker/global_axial_c1c_checker.py
          git hash-object .github/workflows/oblate-global-axial-c1c.yml
          cat analysis/GLOBAL_AXIAL_C1C_PRE_RUN_AMENDMENT.md
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned prototype dependency
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements-prototype.txt
      - name: Install hash-pinned Arb binary wheel
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements-interval.txt
      - name: Run inherited C0a four-group raw audit
        run: PYTHONPATH=. python analysis/c0a_four_group_raw_audit.py
      - name: Run C1c producer
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python producer/global_axial_c1c_producer.py | tee c1c-producer.log
      - name: Run C1c checker
        shell: bash
        run: |
          set -o pipefail
          PYTHONPATH=. python checker/global_axial_c1c_checker.py | tee c1c-checker.log
      - name: Compare producer and checker gates
        run: |
          python - <<'PY'
          from pathlib import Path

          def field(path, prefix):
              rows = [x for x in Path(path).read_text().splitlines() if x.startswith(prefix)]
              if len(rows) != 1:
                  raise SystemExit(f"{path}: expected one {prefix!r}, got {len(rows)}")
              return rows[0].split()

          p_stage = field("c1c-producer.log", "C1C_G3_FIRST_PASS")
          c_stage = field("c1c-checker.log", "C1C_G3_FIRST_PASS")
          p_final = field("c1c-producer.log", "LOGICAL_FINAL_C1C_MACHINE")
          c_final = field("c1c-checker.log", "LOGICAL_FINAL_C1C_MACHINE")
          if p_stage[1:] != c_stage[1:]:
              raise SystemExit(f"first-stage mismatch: {p_stage} != {c_stage}")
          if p_final[1] != "PASS" or c_final[1] != "PASS":
              raise SystemExit(f"machine gate unresolved: {p_final} / {c_final}")
          print("C1C_PRODUCER_CHECKER_AGREEMENT PASS", "first_stage", p_stage[1])
          print("C1C_ASSEMBLY_STATUS PENDING_C1B_ANCHOR_AND_EXACT_COVER")
          PY
