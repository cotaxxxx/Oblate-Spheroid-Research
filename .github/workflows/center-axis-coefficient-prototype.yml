name: Center-axis coefficient prototype

on:
  push:
    branches:
      - implementation/gt-boundary-two-chart
  workflow_dispatch:

permissions:
  contents: read

jobs:
  center-axis:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Arb dependency
        run: python -m pip install --require-hashes --only-binary=:all: --requirement requirements-interval.txt
      - name: Run producer
        run: PYTHONPATH=. python producer/center_axis_coefficient_producer.py
      - name: Run independent checker
        run: PYTHONPATH=. python checker/center_axis_coefficient_checker.py
