name: Meridian off-axis diagnostic

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  meridian-diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install diagnostic dependencies
        run: python -m pip install --only-binary=:all: mpmath==1.4.1 numpy==2.1.3
      - name: Run same-evaluator axial row scan
        run: PYTHONPATH=. python analysis/meridian_axis_row_scan.py
