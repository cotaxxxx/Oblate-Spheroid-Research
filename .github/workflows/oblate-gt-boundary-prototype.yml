name: Oblate boundary t-derivative prototype

on:
  push:
    branches:
      - implementation/gt-boundary-two-chart
  pull_request:
    branches:
      - receipt-binding-e5ab171
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gt-boundary-prototype:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pinned prototype dependency
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements-prototype.txt
      - name: Install hash-pinned Arb binary wheel
        run: >-
          python -m pip install --require-hashes --only-binary=:all: --requirement requirements-interval.txt
      - name: Run exact inherited endpoint controls
        run: python -m unittest controls/test_endpoint_algebra.py
      - name: Run boundary t-derivative producer and independent checker
        run: python -m unittest tests/test_gt_boundary_interval.py
      - name: Run non-gating term-by-chart width diagnostic
        run: PYTHONPATH=. python analysis/monotone_tube_width_diagnostic.py
      - name: Run non-gating u-threshold diagnostic
        run: PYTHONPATH=. python analysis/monotone_tube_threshold_diagnostic.py
      - name: Run separately declared monotone tube refinement
        run: python -m unittest tests/test_monotone_tube_refinement.py
      - name: Run corrected lower-edge first-box width diagnostic
        run: PYTHONPATH=. python analysis/census_lower_edge_width_diagnostic.py
      - name: Run lower slab and 31/32 edge gates
        run: python -m unittest tests/test_lower_slab_and_edge_31_32.py
      - name: Reconstruct exact local-entry monotonicity margin
        run: PYTHONPATH=. python analysis/local_entry_m_exact_diagnostic.py
      - name: Diagnose center-strip positive derivative
        run: PYTHONPATH=. python analysis/global_axial_center_derivative_diagnostic.py
      - name: Diagnose global axial positivity outside center strip
        run: PYTHONPATH=. python analysis/global_axial_positive_diagnostic.py
      - name: Run corrected lower-edge 256-box refinement
        run: python -m unittest tests/test_census_lower_edge_refinement.py
      - name: Preserve corrected lower-edge one-box unresolved control
        run: python -m unittest tests/test_census_lower_edge.py
      - name: Run fixed initial 64-box monotone tube producer and checker
        run: python -m unittest tests/test_monotone_tube_interval.py
